name: Release

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret involved.
# Requires a trusted publisher for this repo + workflow configured at
# npmjs.com → customer-experience-excellence → Settings → Trusted Publisher.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC; publishing fails without it

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # trusted publishing needs >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest # needs >= 11.5.1

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Smoke-test the installer
        run: |
          node bin/install.mjs --dir "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/customer-experience-excellence/SKILL.md"
          test -f "$RUNNER_TEMP/skills/customer-experience-excellence/references/accessibility.md"
          test ! -e "$RUNNER_TEMP/skills/customer-experience-excellence/package.json"
          for cmd in build review explore optimize a11y rubric journey; do
            test -f "$RUNNER_TEMP/commands/cex/$cmd.md" || {
              echo "::error::missing command $cmd.md"; exit 1; }
          done

      - name: Publish
        run: npm publish
