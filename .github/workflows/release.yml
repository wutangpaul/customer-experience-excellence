name: Release

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret involved.
# Requires a trusted publisher for this repo + workflow configured at
# npmjs.com → customer-experience-excellence → Settings → Trusted Publisher.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC; publishing fails without it

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # trusted publishing needs >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest # needs >= 11.5.1

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Releasing $PKG"

      - name: Smoke-test the installer
        run: |
          # Mirror a real install: commands are only discoverable under .claude.
          SKILLS="$RUNNER_TEMP/.claude/skills"
          SKILL="$SKILLS/customer-experience-excellence"

          node bin/install.mjs --dir "$SKILLS" | tee "$RUNNER_TEMP/install.log"
          test -f "$SKILL/SKILL.md"
          test -f "$SKILL/references/accessibility.md"
          test -f "$SKILL/.cex-manifest.json"
          test ! -e "$SKILL/package.json"
          test ! -e "$SKILL/README.md"
          for cmd in build review explore optimize a11y rubric journey modernize help; do
            test -f "$RUNNER_TEMP/.claude/commands/cex/$cmd.md" || {
              echo "::error::missing command $cmd.md"; exit 1; }
          done
          # A correct install has nothing to warn about.
          if grep -q "Warning:" "$RUNNER_TEMP/install.log"; then
            echo "::error::unexpected warning from a valid install"; cat "$RUNNER_TEMP/install.log"; exit 1
          fi

          # An upgrade must never silently discard a local edit.
          echo "# local edit" >> "$SKILL/references/review-rubric.md"
          if node bin/install.mjs --dir "$SKILLS" --force; then
            echo "::error::--force overwrote a locally edited file without consent"; exit 1
          fi
          grep -q "# local edit" "$SKILL/references/review-rubric.md" || {
            echo "::error::local edit was destroyed"; exit 1; }

          # ...but --yes is still an explicit override, and --uninstall cleans up.
          node bin/install.mjs --dir "$SKILLS" --force --yes
          node bin/install.mjs --dir "$SKILLS" --uninstall --yes
          test ! -e "$SKILL"

      - name: Publish
        run: npm publish
